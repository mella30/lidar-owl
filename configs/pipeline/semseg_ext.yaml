name: SemSegExt
# Cross-platform stable default
num_workers: 2
pin_memory: false  # TODO: test if faster, then allocate more CPU RAM
# prefetch_factor: 1  # NOT used by Open3D ML
# persistent_workers: false  # NOT used by Open3D ML
optimizer:
  lr: 0.001
scheduler_gamma: 0.9886
batch_size: 2
val_batch_size: 1
test_batch_size: 1
main_log_dir: ./logs
train_sum_dir: ${.main_log_dir}/train_logs/
eval_sum_dir: ${.main_log_dir}/eval_logs/
max_epoch: 100
save_ckpt_freq: 10
summary:
  record_for: ['train', 'valid']  # visu for debug purposes, leave empty in final run
  max_pts: 15000
  use_reference: false
  max_outputs: 5
